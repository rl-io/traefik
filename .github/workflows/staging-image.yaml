name: Staging image

on:
  # workflow_dispatch alone is not enough: GitHub only offers it for workflows
  # that exist on the default branch, and this one lives on a topic branch.
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        default: linux/arm64
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          platforms: ${{ inputs.platforms || 'linux/arm64' }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: VERSION=v3.7.1-gwsort-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
